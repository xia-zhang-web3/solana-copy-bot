name: Native Handoff B136 Diagnostic

on:
  push:
    branches:
      - codex/native-handoff-publication-candidate-20260923
    paths:
      - .github/workflows/native-handoff-b136-diagnostic.yml
      - crates/app/src/app_tests/b136*.rs

permissions:
  contents: read

jobs:
  exact-recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: target/artifacts/copybot-app
    steps:
      - uses: actions/checkout@v4
      - name: Rust versions
        run: |
          rustc --version
          cargo --version
      - name: Cache cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target/artifacts/copybot-app
          key: cargo-artifact-${{ runner.os }}-copybot-app-${{ hashFiles('Cargo.lock', 'rust-toolchain*', '.cargo/**') }}
          restore-keys: |
            cargo-artifact-${{ runner.os }}-copybot-app-
            cargo-artifact-${{ runner.os }}-
      - name: B136 predecessor context with immediate output
        shell: bash
        run: |
          set -euo pipefail
          echo "context=all B136 tests in one serial libtest process"
          env -u FRACTIONAL_FIXTURE_ROOT RUST_MIN_STACK=8388608 RUST_BACKTRACE=1 \
            timeout --signal=KILL 300s \
            cargo test --locked -p copybot-app --bin copybot-app \
              app_tests::b136_ -- --nocapture --test-threads=1
