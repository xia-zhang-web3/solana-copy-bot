name: Native Handoff B136 Diagnostic

on:
  push:
    branches:
      - codex/native-handoff-publication-candidate-20260923
    paths:
      - .github/workflows/native-handoff-b136-diagnostic.yml
      - crates/app/src/app_tests/b136*.rs

permissions:
  contents: read

jobs:
  exact-recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: target/artifacts/copybot-app
    steps:
      - uses: actions/checkout@v4
      - name: Rust versions
        run: |
          rustc --version
          cargo --version
      - name: Cache cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target/artifacts/copybot-app
          key: cargo-artifact-${{ runner.os }}-copybot-app-${{ hashFiles('Cargo.lock', 'rust-toolchain*', '.cargo/**') }}
          restore-keys: |
            cargo-artifact-${{ runner.os }}-copybot-app-
            cargo-artifact-${{ runner.os }}-
      - name: Exact recovery failures with immediate output
        shell: bash
        run: |
          set -euo pipefail
          env -u FRACTIONAL_FIXTURE_ROOT RUST_MIN_STACK=8388608 RUST_BACKTRACE=1 \
            timeout --signal=KILL 300s bash -s <<'BASH'
          set +e
          cargo test --locked -p copybot-app --bin copybot-app \
            app_tests::b136_r1_lifecycle_tests::b136_r1_parent_shutdown_does_not_strand_or_panic_cancelled_recovery \
            -- --exact --nocapture --test-threads=1
          first=$?
          echo "first_test_exit=$first"
          cargo test --locked -p copybot-app --bin copybot-app \
            app_tests::b136_recovery_tests::b136_recovery_success_failed_unknown_stop_expiry_and_config_removal \
            -- --exact --nocapture --test-threads=1
          second=$?
          echo "second_test_exit=$second"
          if [ "$first" -ne 0 ] || [ "$second" -ne 0 ]; then exit 1; fi
          BASH
