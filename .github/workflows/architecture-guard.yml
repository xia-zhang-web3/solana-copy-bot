name: Architecture Guard

on:
  pull_request:
    paths:
      - ".github/workflows/architecture-guard.yml"
      - ".github/workflows/operator-artifacts.yml"
      - "AGENTS.md"
      - "ARCHITECTURE_WAIVERS.md"
      - "ARTIFACT_DEPLOY.md"
      - "BUILD_ARCHITECTURE_REDESIGN_NO_HOUR_BUILDS.md"
      - "BUILD_POLICY.md"
      - "BUILD_REFACTOR_ROADMAP.md"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".cargo/**"
      - "clippy.toml"
      - "configs/**"
      - "crates/**"
      - "docs/**"
      - "migrations/**"
      - "ops/**"
      - "rust-toolchain*"
      - "rustfmt.toml"
      - "tools/**"
  push:
    paths:
      - ".github/workflows/architecture-guard.yml"
      - ".github/workflows/operator-artifacts.yml"
      - "AGENTS.md"
      - "ARCHITECTURE_WAIVERS.md"
      - "ARTIFACT_DEPLOY.md"
      - "BUILD_ARCHITECTURE_REDESIGN_NO_HOUR_BUILDS.md"
      - "BUILD_POLICY.md"
      - "BUILD_REFACTOR_ROADMAP.md"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".cargo/**"
      - "clippy.toml"
      - "configs/**"
      - "crates/**"
      - "docs/**"
      - "migrations/**"
      - "ops/**"
      - "rust-toolchain*"
      - "rustfmt.toml"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve changed range
        shell: bash
        run: |
          set -euo pipefail
          candidate=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            candidate="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            candidate="${{ github.event.before }}"
          fi
          if [ -n "$candidate" ] && git diff --name-only "$candidate..HEAD" >/dev/null 2>&1; then
            range="$candidate..HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            range="HEAD^..HEAD"
          else
            empty_tree="$(git hash-object -t tree /dev/null)"
            range="$empty_tree..HEAD"
          fi
          echo "ARCH_GUARD_DIFF_RANGE=$range" >> "$GITHUB_ENV"
          echo "architecture_guard_range=$range"

      - name: Architecture guard
        run: |
          tools/architecture_guard.sh --changed
          tools/architecture_guard.sh --all

  tools-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Tool regression tests
        run: python3 tools/run_tool_tests.py --shard-index ${{ matrix.shard }} --shard-count 3

  architecture-guard:
    name: architecture-guard
    if: ${{ always() }}
    needs: [guard, tools-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          needs = json.loads(os.environ['NEEDS_JSON'])
          expected = {'guard', 'tools-tests'}
          passed = set(needs) == expected and all(
              needs[job].get('result') == 'success' for job in expected
          )
          if not passed:
              print('Architecture guard or tools test shards did not succeed', file=sys.stderr)
          sys.exit(0 if passed else 1)
          PYTHON
